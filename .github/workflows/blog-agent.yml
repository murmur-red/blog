name: Blog Writing Agent

on:
  workflow_dispatch:           # triggered by cron-job.org at 6:00 AM UTC Mon/Wed/Fri

permissions:
  contents: write

jobs:
  write-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate and publish post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MURMUR_WEBSITE_TOKEN: ${{ secrets.MURMUR_WEBSITE_TOKEN }}
        run: python scripts/blog_agent.py

      - name: Trigger Jekyll deployment
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/murmur-red/blog/actions/workflows/jekyll.yml/dispatches \
            -d '{"ref":"main"}'
